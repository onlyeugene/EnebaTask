# Live reload for local dev. Run `air` from server/.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin"]
  # Tests don't change the running server, so editing them shouldn't restart it.
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # SIGINT instead of SIGKILL, so main.go's graceful shutdown runs and the Mongo client disconnects.
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true

[misc]
  clean_on_exit = true
